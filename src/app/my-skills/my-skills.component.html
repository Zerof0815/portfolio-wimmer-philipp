<div class="my-skills">
    <h1>{{texts[languageService.currentLang()].mySkills}}</h1>
    <div class="content">
        <div class="skill-icons">
            @for (icon of skillIcons; track icon) {
                <img src="{{icon}}" alt="">
            }
        </div>
        <div class="currently-learning">
            <img class="ellipse" src="assets/img/my-skills/ellipse.png" alt="">
            <div class="learning-text">
                <p class="c-blue">{{ texts[languageService.currentLang()].currentlyLearning}}</p>
                <img src="assets/img/atf/stiker-4574586_1280.png" alt="">
                <p>{{texts[languageService.currentLang()].currentlyLearningText}}</p>
            </div>
        </div>
    </div>
</div>
